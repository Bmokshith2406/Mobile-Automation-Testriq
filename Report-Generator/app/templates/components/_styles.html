<style>

    :root {
      /* Minimal Corporate Color Palette - 4 Colors */
      --primary: #1e40af;
      --primary-light: #3b82f6;
      --primary-dark: #1e3a8a;
      --success: #059669;
      --success-light: #d1fae5;
      --danger: #dc2626;
      --danger-light: #fee2e2;
      --info: #0369a1;
      --warning: #f59e0b;

      /* Premium Neutrals - Light Mode */
      --bg: #ffffff;
      --bg-secondary: #fafbfc;
      --bg-tertiary: #f3f4f6;
      --bg-hover: #f9fafb;
      
      /* Text Hierarchy */
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --text-tertiary: #94a3b8;
      
      /* Borders & Dividers */
      --border: #e2e8f0;
      --border-light: #f1f5f9;
      --border-subtle: #cbd5e1;

      /* Shadows - Premium Elevation */
      --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.08), 0 1px 2px 0 rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }


    /* Manual dark mode toggle */
    body.dark-mode {
      --bg: #0f172a;
      --bg-secondary: #1e293b;
      --bg-tertiary: #334155;
      --bg-hover: #1f2937;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-tertiary: #94a3b8;
      --border: #334155;
      --border-light: #475569;
      --border-subtle: #64748b;
      --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.4), 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: var(--bg);
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Segoe UI', 'Aptos', 'Helvetica Neue', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      font-feature-settings: 'rlig' 1, 'calt' 1;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 48px 32px;
    display: block;
    }
    .main-content {
      display: flex;
      flex-direction: column;
    }

    /* Theme toggle button */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 18px;
      transition: all 0.25s ease;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
    }

    .theme-toggle:hover {
      background: var(--bg-hover);
      box-shadow: var(--shadow-md);
    }

    .theme-toggle:focus {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* ============================================
       HEADER & NAVIGATION
       ============================================ */

    .header {
      margin-bottom: 48px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 32px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 32px;
    }

    .header-kicker {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .header-left h1 {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
      color: var(--text-primary);
      line-height: 1.1;
    }



    .header-description {
      max-width: 760px;
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 18px;
    }

    .testcase-panel {
      display: inline-flex;
      flex-direction: column;
      gap: 6px;
      padding: 18px 20px;
      background: linear-gradient(135deg, rgba(30, 64, 175, 0.06), rgba(3, 105, 161, 0.04));
      border: 1px solid rgba(30, 64, 175, 0.12);
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-xs);
    }

    .testcase-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-tertiary);
    }

    .testcase-name {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      word-break: break-word;
    }

    .header-meta {
      display: flex;
      flex-direction: row;
      gap: 14px;
      flex-wrap: wrap;
    }

    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 190px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg-secondary);
      box-shadow: var(--shadow-xs);
    }

    .meta-label {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-tertiary);
    }

    .meta-item strong {
      color: var(--text-primary);
      font-weight: 600;
      font-size: 13px;
      line-height: 1.5;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
      box-shadow: var(--shadow-xs);
    }

    .btn:hover {
      background: var(--bg-hover);
      border-color: var(--primary-light);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    /* ============================================
       TABS & FILTERS
       ============================================ */

    .tabs-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
      gap: 32px;
    }

    .tabs {
      display: flex;
      gap: 32px;
    }

    .tab {
      position: relative;
      padding: 6px 0;
      font-weight: 500;
      font-size: 14px;
      color: var(--text-secondary);
      cursor: pointer;
      border: none;
      background: none;
      transition: color 0.25s ease;
    }

    .tab:hover {
      color: var(--text-primary);
    }

    .tab.active {
      color: var(--primary);
      font-weight: 600;
    }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--primary);
      border-radius: 2px 2px 0 0;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-left: auto;
    }

    /* Base */
    .filter-btn {
      padding: 8px 14px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }

    .filter-btn:hover {
      border-color: var(--primary-light);
      background: var(--bg-hover);
    }

    /* PASSED (Green) */
    .filter-btn.passed:hover {
      background: rgba(5, 150, 105, 0.08);
      border-color: var(--success);
      color: var(--success);
    }

    .filter-btn.passed.active {
      background: var(--success);
      border-color: var(--success);
      color: white;
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
    }

    /* FAILED (Red) */
    .filter-btn.failed:hover {
      background: rgba(220, 38, 38, 0.08);
      border-color: var(--danger);
      color: var(--danger);
    }

    .filter-btn.failed.active {
      background: var(--danger);
      border-color: var(--danger);
      color: white;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
    }

    /* ALL (Primary) */
    .filter-btn.active:not(.passed):not(.failed) {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
      box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
    }

    /* ============================================
       STATS GRID - Premium Cards
       ============================================ */

    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      box-shadow: var(--shadow-xs);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--primary);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .stat-card:hover {
      border-color: var(--primary-light);
      box-shadow: var(--shadow-md);
      transform: translateY(-4px);
    }

    .stat-card:hover::before {
      opacity: 1;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-tertiary);
      letter-spacing: 0.08em;
      margin-bottom: 16px;
      display: block;
    }

    .stat-value {
      font-size: 38px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .stat-unit {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .stat-card.success .stat-value {
      color: var(--success);
    }

    .stat-card.danger .stat-value {
      color: var(--danger);
    }

    .stat-card.info .stat-value {
      color: var(--info);
    }

    /* ============================================
       PROGRESS & SUMMARY - Premium Layout
       ============================================ */

    .summary-section {
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 24px;
      margin-bottom: 40px;
      align-items: stretch;
    }

    .progress-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      box-shadow: var(--shadow-xs);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .progress-card:hover {
      box-shadow: var(--shadow-sm);
      border-color: var(--border-subtle);
    }

    .progress-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;  /* NOT baseline */
      margin-bottom: 6px;   /* tighter */
    }

    .progress-title {
      font-weight: 700;
      font-size: 15px;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .progress-value {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      background: rgba(30, 64, 175, 0.08);
      padding: 4px 10px;
      border-radius: 6px;
      line-height: 1;
    }

    .progress-bar {
      height: 8px;
      background: var(--bg-tertiary);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 8px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 999px;
    }

    .narrative-card {
      margin-top: 18px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-secondary);
    }

    .donut-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-xs);
    }

    .donut-wrapper {
      position: relative;
      width: 160px;
      height: 160px;
      margin-bottom: 12px;
    }

    .donut-svg {
      transform: rotate(-90deg);
    }

    .donut-center {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .donut-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .donut-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* ============================================
       STEPS SECTION - Premium Expandable Cards
       ============================================ */

    .steps-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .step {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-xs);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .step:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--primary-light);
    }

    .step.failed {
      border-left: 4px solid var(--danger);
    }

    .step.passed {
      border-left: 4px solid var(--success);
    }

    .step-header {
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      gap: 16px;
      user-select: none;
      transition: background-color 0.25s ease;
    }

    .step-header:hover {
      background: var(--bg-hover);
    }

    .step.open .step-header {
      background: var(--bg-hover);
      border-bottom-color: var(--border);
    }

    .step-left {
      flex: 1;
      min-width: 0;
    }

    .step-title {
      font-weight: 700;
      font-size: 21px;
      color: var(--text-primary);
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }

    .step-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .step-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .badge.passed {
      background: rgba(5, 150, 105, 0.12);
      color: var(--success);
    }

    .badge.failed {
      background: rgba(220, 38, 38, 0.12);
      color: var(--danger);
    }

    .badge.unknown,
    .badge.skipped,
    .badge.broken {
      background: rgba(3, 105, 161, 0.12);
      color: var(--info);
    }

    .step-duration {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 700;
      min-width: 70px;
      text-align: right;
      letter-spacing: 0.02em;
    }

    .step-toggle {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 14px;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }

    .step.open .step-toggle {
      transform: rotate(180deg);
      color: var(--primary);
    }

    .step-body {
      display: none;
      border-top: 1px solid var(--border);
      padding: 24px;
      background: var(--bg-secondary);
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .step.open .step-body {
      display: block;
    }

    .step-body-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    .block {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      transition: all 0.25s ease;
    }

    .block:hover {
      border-color: var(--border-subtle);
      box-shadow: var(--shadow-xs);
    }

    .block.ai-block {
      border-color: rgba(245, 158, 11, 0.25);
      background: rgba(245, 158, 11, 0.04);
    }

    .block.ai-block:hover {
      box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.3), var(--shadow-xs);
    }

    .block-label {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-tertiary);
      letter-spacing: 0.08em;
      display: block;
      margin-bottom: 10px;
    }

    .block-content {
      font-size: 12px;
      color: var(--text-primary);
      line-height: 1.6;
      word-break: break-word;
    }

    .block-content a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.25s ease;
    }

    .block-content a:hover {
      color: var(--primary-dark);
      text-decoration: underline;
      text-decoration-thickness: 1.5px;
      text-underline-offset: 3px;
    }
    
    .repair-details-grid .block {
      margin-bottom: 12px;
    }

    .repair-details-grid .block:last-child {
      margin-bottom: 0;
    }
    
    .repair-details-grid .block {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .repair-details-grid .block:nth-child(1) {
      border-left: 4px solid var(--warning);
    }

    .repair-details-grid .block:nth-child(2) {
      border-left: 4px solid var(--primary);
    }

    .repair-details-grid .block:nth-child(3) {
      border-left: 4px solid var(--danger);
    }

    .repair-details-grid .block:nth-child(4) {
      border-left: 4px solid var(--success);
    }

    .screenshot-wrapper {
      margin-top: 16px;
    }

    .screenshot-label {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-tertiary);
      letter-spacing: 0.08em;
      display: block;
      margin-bottom: 10px;
    }

    .screenshot-img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-xs);
    }

    .screenshot-img:hover {
      box-shadow: var(--shadow-lg);
      border-color: var(--primary-light);
      transform: translateY(-2px);
    }

    /* ============================================
       MODAL - Premium Overlay
       ============================================ */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      backdrop-filter: blur(8px);
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        backdrop-filter: blur(0px);
      }
      to {
        opacity: 1;
        backdrop-filter: blur(8px);
      }
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      background: var(--bg);
      border-radius: 14px;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-xl);
      animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-weight: 700;
      font-size: 17px;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .modal-body {
      display: flex;
      gap: 16px;
      overflow: hidden;
      flex: 1;
      padding: 24px;
    }

    .canvas-wrapper {
      position: relative;
      overflow: auto;
      flex: 1;
